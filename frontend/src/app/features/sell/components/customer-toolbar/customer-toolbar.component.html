<div class="customer-toolbar">
  <mat-form-field appearance="outline" class="customer-field" subscriptSizing="dynamic">
    <mat-label>Customer</mat-label>
    <input
      matInput
      type="text"
      placeholder="Search by name or phone"
      [(ngModel)]="filterText"
      [matAutocomplete]="customerAuto"
    />
    <mat-icon matPrefix>person_search</mat-icon>
  </mat-form-field>

  <mat-autocomplete #customerAuto="matAutocomplete" [displayWith]="displayCustomer" (optionSelected)="onOptionSelected($event)">
    @for (customer of filteredCustomers(); track customer.id) {
      <mat-option [value]="customer">
        <span class="option-name">{{ customer.name }}</span>
        <span class="option-phone">{{ customer.phone }}</span>
      </mat-option>
    }
  </mat-autocomplete>

  <button mat-icon-button type="button" aria-label="Search customers" (click)="search()">
    <mat-icon>search</mat-icon>
  </button>

  <button mat-stroked-button type="button" class="add-button" (click)="addCustomer.emit()">
    <mat-icon>person_add</mat-icon>
    Add Customer
  </button>
</div>
