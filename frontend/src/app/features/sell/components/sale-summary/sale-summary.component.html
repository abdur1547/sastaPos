<div class="summary">
  <div class="summary-row">
    <span class="summary-label">Total items ({{ itemCount() }})</span>
    <span class="summary-value">{{ totalQuantity() }} units</span>
  </div>

  <div class="summary-row">
    <span class="summary-label">Subtotal</span>
    <span class="summary-value">Rs {{ subtotal() }}</span>
  </div>

  <div class="summary-row">
    <span class="summary-label">Discount</span>
    <input
      class="discount-input"
      type="number"
      min="0"
      step="0.01"
      [attr.aria-invalid]="discountError() || discount().invalid"
      [formControl]="discount()"
    />
  </div>

  <div class="summary-row">
    <span class="summary-label">Tax</span>
    <span class="summary-value">Rs {{ tax() }}</span>
  </div>

  <div class="summary-row total-row">
    <span class="summary-label">Total Payable</span>
    <span class="summary-value total-value">Rs {{ totalPayable() }}</span>
  </div>
</div>
