<div class="sell-page">
  <app-pending-bills-bar
    class="section"
    [bills]="pendingBills()"
    (resumed)="onResumeBill($event)"
    (removed)="onRemoveBill($event)"
  />

  <app-customer-toolbar
    class="section"
    [customers]="customers()"
    [customer]="store.customer()"
    (customerSelected)="onCustomerSelected($event)"
    (customerCleared)="store.setCustomer(null)"
    (addCustomer)="onAddCustomer()"
  />

  <app-product-toolbar
    class="section"
    [products]="products()"
    (productSelected)="store.addProduct($event)"
    (addProduct)="onAddProduct()"
    (createReturn)="onCreateReturn()"
  />

  @if (development) {
  <section class="section">
    <h2 class="text-sm font-bold">Simulated scanner (dev)</h2>
    <p class="mb-3 text-sm">
      No physical device connected. Scans add exact barcode matches anywhere on
      Sell. Scanning pauses during dialogs and sale operations.
    </p>
    @if (scannerError()) {
    <app-form-alert>{{ scannerError() }}</app-form-alert>
    }
    <div class="flex flex-wrap items-center gap-4">
      <mat-form-field appearance="outline">
        <mat-label>Simulated barcode</mat-label>
        <input
          matInput
          [formControl]="simulatedBarcode"
          autocomplete="off"
          [readonly]="!scanningAllowed()"
          (keydown.enter)="$event.preventDefault(); simulateScan()"
        />
      </mat-form-field>
      <button
        mat-stroked-button
        type="button"
        [disabled]="!scannerReady() || scannerBusy() || !scanningAllowed()"
        (click)="simulateScan()"
      >
        Scan Once
      </button>
    </div>
  </section>
  }

  <app-sale-items-table
    class="section"
    [lines]="store.lines"
    [priced]="store.totals().lines"
    (removeItem)="store.removeProduct($event)"
  />

  <app-sale-summary
    class="section"
    [itemCount]="store.items().length"
    [totalQuantity]="store.totalQuantity()"
    [subtotal]="store.totals().subtotal"
    [discount]="store.form.controls.discount"
    [discountError]="store.discountTooHigh()"
    [tax]="store.totals().tax"
    [totalPayable]="store.totals().total"
  />

  <app-sale-actions
    class="section"
    [canSave]="canSubmit()"
    [canPay]="canSubmit()"
    (addToPending)="onAddToPending()"
    (cancelSale)="onCancelSale()"
    (pay)="onPay()"
  />
</div>
