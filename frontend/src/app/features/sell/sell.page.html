<div class="sell-page">
  <app-pending-bills-bar
    class="section"
    [bills]="pendingBills()"
    (resume)="onResumeBill($event)"
    (remove)="onRemoveBill($event)"
  />

  <app-customer-toolbar
    class="section"
    [customers]="customers()"
    [customer]="store.customer()"
    (customerSelected)="onCustomerSelected($event)"
    (customerCleared)="store.setCustomer(null)"
    (addCustomer)="onAddCustomer()"
  />

  <app-product-toolbar
    class="section"
    [products]="products()"
    (productSelected)="store.addProduct($event)"
    (addProduct)="onAddProduct()"
    (createReturn)="onCreateReturn()"
  />

  <app-sale-items-table
    class="section"
    [lines]="store.lines"
    [priced]="store.totals().lines"
    (removeItem)="store.removeProduct($event)"
  />

  <app-sale-summary
    class="section"
    [itemCount]="store.items().length"
    [totalQuantity]="store.totalQuantity()"
    [discount]="store.form.controls.discount"
    [discountError]="store.discountTooHigh()"
    [tax]="store.totals().tax"
    [totalPayable]="store.totals().total"
  />

  <app-sale-actions
    class="section"
    [canSave]="canSubmit()"
    [canPay]="canSubmit()"
    (addToPending)="onAddToPending()"
    (cancelSale)="onCancelSale()"
    (pay)="onPay()"
  />
</div>
