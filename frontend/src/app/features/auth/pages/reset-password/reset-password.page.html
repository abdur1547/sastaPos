@if (step() === 'request') {
  <app-auth-shell
    eyebrow="Account recovery"
    title="Reset password"
    subtitle="Enter your email and we will send you a reset token."
  >
    <form class="grid gap-1" [formGroup]="requestForm" (ngSubmit)="submitRequest()" novalidate>
      <app-form-field
        [control]="requestForm.controls.email"
        label="Email"
        type="email"
        autocomplete="email"
        icon="mail"
      />

      @if (formError()) {
        <div class="mb-3"><app-form-alert>{{ formError() }}</app-form-alert></div>
      }

      <button mat-flat-button type="submit" class="h-11! w-full! bg-(--accent-teal)! font-bold! text-white! disabled:opacity-60" [disabled]="submitting()">
        @if (submitting()) {
          <mat-spinner diameter="18" class="mr-2 inline-block" />
          Sending…
        } @else {
          Send reset token
        }
      </button>

      <button mat-button type="button" class="mt-2" (click)="showCompleteStep()">I already have a token</button>
    </form>

    <span authFooter>
      Remembered it?
      <a class="font-bold text-teal-700 hover:underline" routerLink="/auth/login">Back to sign in</a>
    </span>
  </app-auth-shell>
} @else {
  <app-auth-shell eyebrow="Account recovery" title="Choose a new password" subtitle="Enter the token you received.">
    @if (infoMessage()) {
      <div class="mb-4"><app-form-alert tone="success">{{ infoMessage() }}</app-form-alert></div>
    }

    <form class="grid gap-1" [formGroup]="completeForm" (ngSubmit)="submitComplete()" novalidate>
      <app-form-field [control]="completeForm.controls.token" label="Reset token" icon="key" />
      <app-form-field
        [control]="completeForm.controls.newPassword"
        label="New password"
        type="password"
        autocomplete="new-password"
        icon="lock"
      />
      <app-form-field
        [control]="completeForm.controls.confirmPassword"
        label="Confirm new password"
        type="password"
        autocomplete="new-password"
        icon="lock"
      />

      @if (formError()) {
        <div class="mb-3"><app-form-alert>{{ formError() }}</app-form-alert></div>
      }

      <button mat-flat-button type="submit" class="h-11! w-full! bg-(--accent-teal)! font-bold! text-white! disabled:opacity-60" [disabled]="submitting()">
        @if (submitting()) {
          <mat-spinner diameter="18" class="mr-2 inline-block" />
          Saving…
        } @else {
          Update password
        }
      </button>

      <button mat-button type="button" class="mt-2" (click)="showRequestStep()">Request a new token</button>
    </form>

    <span authFooter>
      <a class="font-bold text-teal-700 hover:underline" routerLink="/auth/login">Back to sign in</a>
    </span>
  </app-auth-shell>
}
