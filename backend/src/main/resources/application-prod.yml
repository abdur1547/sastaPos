spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/sastaPos}
    username: ${JDBC_DATABASE_USERNAME:postgres}
    password: ${JDBC_DATABASE_PASSWORD:postgres}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    # Raw SQL goes to stdout outside the logging system and would corrupt structured JSON logs.
    show-sql: false
    format-sql: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true
  flyway:
    enabled: false
    locations: classpath:db/migrations
    baseline-on-migrate: true

  docker:
    compose:
      # Postgres is started manually via the root-level docker-compose.yml (shared with PowerSync).
      enabled: false

error:
  handling:
    http-status-in-json-response: true
    exception-logging: NO_LOGGING
    full-stacktrace-http-statuses: 5xx
    log-levels:
      5xx: ERROR
    codes:
      ProductNameUnique: PRODUCT_NAME_UNIQUE
      ProductSkuUnique: PRODUCT_SKU_UNIQUE
      ProductBarcodeUnique: PRODUCT_BARCODE_UNIQUE

springdoc:
  pathsToMatch: /, /api/**

logging:
  structured:
    # One JSON object per line for log shippers (Loki, ELK, CloudWatch, ...). Use ecs, logstash or gelf;
    # set LOG_FORMAT_CONSOLE to an empty value to fall back to plain-text logs.
    format:
      console: ${LOG_FORMAT_CONSOLE:ecs}
      file: ${LOG_FORMAT_FILE:ecs}
    ecs:
      service:
        name: sasta-pos
        environment: prod
  # File logging is off unless LOG_FILE is set (e.g. /var/log/sasta-pos/app.log).
  file:
    name: ${LOG_FILE:}
  logback:
    rollingpolicy:
      max-file-size: ${LOG_FILE_MAX_SIZE:10MB}
      max-history: ${LOG_FILE_MAX_HISTORY:14}
      total-size-cap: ${LOG_FILE_TOTAL_SIZE_CAP:1GB}
      clean-history-on-start: false
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.sastapos.sasta_pos: ${LOG_LEVEL_APP:INFO}
    com.sastapos.sasta_pos.http: ${LOG_LEVEL_HTTP:INFO}
    org.hibernate.SQL: WARN
    org.springframework.security: WARN

app:
  logging:
    http:
      # Summary line only; bodies may contain customer/sale data and must stay off unless debugging.
      include-headers: ${HTTP_LOGGING_INCLUDE_HEADERS:false}
      include-request-body: ${HTTP_LOGGING_INCLUDE_REQUEST_BODY:false}
      include-response-body: ${HTTP_LOGGING_INCLUDE_RESPONSE_BODY:false}
      max-payload-length: ${HTTP_LOGGING_MAX_PAYLOAD_LENGTH:2048}
      slow-request-threshold: ${HTTP_LOGGING_SLOW_REQUEST_THRESHOLD:1s}
