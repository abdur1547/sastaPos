spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/sastaPos}
    username: ${JDBC_DATABASE_USERNAME:postgres}
    password: ${JDBC_DATABASE_PASSWORD:postgres}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    format-sql: true
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true
  flyway:
    enabled: false
    locations: classpath:db/migrations
    baseline-on-migrate: true

  docker:
    compose:
      # Postgres is started manually via the root-level docker-compose.yml (shared with PowerSync).
      enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  logging:
    http:
      # Verbose exchange logging for local debugging; sensitive headers/fields are still masked.
      include-headers: ${HTTP_LOGGING_INCLUDE_HEADERS:true}
      include-request-body: ${HTTP_LOGGING_INCLUDE_REQUEST_BODY:true}
      include-response-body: ${HTTP_LOGGING_INCLUDE_RESPONSE_BODY:true}
      max-payload-length: ${HTTP_LOGGING_MAX_PAYLOAD_LENGTH:10000}

server:
  port: ${SERVER_PORT:8090}

logging:
  level:
    com.sastapos.sasta_pos: ${LOG_LEVEL_APP:DEBUG}

error:
  handling:
    http-status-in-json-response: true
    exception-logging: NO_LOGGING
    full-stacktrace-http-statuses: 5xx
    log-levels:
      5xx: ERROR
    codes:
      ProductNameUnique: PRODUCT_NAME_UNIQUE
      ProductSkuUnique: PRODUCT_SKU_UNIQUE
      ProductBarcodeUnique: PRODUCT_BARCODE_UNIQUE

springdoc:
  pathsToMatch: /, /api/**
