spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/sastaPos}
    username: ${JDBC_DATABASE_USERNAME:postgres}
    password: ${JDBC_DATABASE_PASSWORD:postgres}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    format-sql: true
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true
  flyway:
    enabled: false
    locations: classpath:db/migrations
    baseline-on-migrate: true

  docker:
    compose:
      # Postgres is started manually via the root-level docker-compose.yml (shared with PowerSync).
      enabled: true

error:
  handling:
    http-status-in-json-response: true
    exception-logging: NO_LOGGING
    full-stacktrace-http-statuses: 5xx
    log-levels:
      5xx: ERROR
    codes:
      ProductNameUnique: PRODUCT_NAME_UNIQUE
      ProductSkuUnique: PRODUCT_SKU_UNIQUE
      ProductBarcodeUnique: PRODUCT_BARCODE_UNIQUE

springdoc:
  pathsToMatch: /, /api/**

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-in-production-please-please-please}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  password-reset:
    token-expiration-minutes: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:15}
  store:
    default-currency-code: ${DEFAULT_CURRENCY_CODE:PKR}
    default-timezone: ${DEFAULT_TIMEZONE:Asia/Karachi}
