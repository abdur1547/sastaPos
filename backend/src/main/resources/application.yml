spring:
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/sastaPos}
    username: ${JDBC_DATABASE_USERNAME:postgres}
    password: ${JDBC_DATABASE_PASSWORD:postgres}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    format-sql: true
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        id:
          new_generator_mappings: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  docker:
    compose:
      # Postgres is started manually via the root-level docker-compose.yml (shared with PowerSync).
      enabled: false

error:
  handling:
    http-status-in-json-response: true
    exception-logging: NO_LOGGING
    full-stacktrace-http-statuses: 5xx
    log-levels:
      5xx: ERROR

springdoc:
  pathsToMatch: /, /api/**

logging:
  pattern:
    # Prefix every log line with the per-request correlation id (see app.logging.http.request-id-header).
    correlation: "[%X{requestId:-}] "
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.sastapos.sasta_pos: ${LOG_LEVEL_APP:INFO}
    # Request/response access log; set to OFF to silence it, WARN to keep only 4xx/5xx/slow requests.
    com.sastapos.sasta_pos.http: ${LOG_LEVEL_HTTP:INFO}

app:
  logging:
    http:
      enabled: ${HTTP_LOGGING_ENABLED:true}
      request-id-header: X-Request-Id
      include-query-string: true
      include-client-info: true
      include-headers: ${HTTP_LOGGING_INCLUDE_HEADERS:false}
      include-request-body: ${HTTP_LOGGING_INCLUDE_REQUEST_BODY:false}
      include-response-body: ${HTTP_LOGGING_INCLUDE_RESPONSE_BODY:false}
      max-payload-length: ${HTTP_LOGGING_MAX_PAYLOAD_LENGTH:2048}
      slow-request-threshold: ${HTTP_LOGGING_SLOW_REQUEST_THRESHOLD:2s}
      excluded-paths: /actuator/**, /swagger-ui/**, /swagger-ui.html, /v3/api-docs/**, /favicon.ico
      masked-headers: authorization, cookie, set-cookie, proxy-authorization, x-api-key
      masked-fields: password, currentPassword, newPassword, confirmPassword, token, accessToken, refreshToken, resetToken, secret, apiKey
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-in-production-please-please-please}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  password-reset:
    token-expiration-minutes: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:15}
  store:
    default-currency-code: ${DEFAULT_CURRENCY_CODE:PKR}
    default-timezone: ${DEFAULT_TIMEZONE:Asia/Karachi}
