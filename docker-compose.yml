# Dev-only Docker Compose: local Postgres, reused by both the backend and the
# imported PowerSync stack (./powersync/docker-compose.yml).
# Production uses ./docker-compose.prod.yml (not this development file).
#
# Usage:
#   cp .env.example .env                       # then edit .env (Postgres/backend vars)
#   cp powersync/.env.example powersync/.env    # then edit powersync/.env (PowerSync vars)
#   docker compose up -d
#   docker compose logs -f powersync

include:
  - path: powersync/docker-compose.yml

services:
  postgres:
    image: postgres:18.6
    container_name: sastapos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sastaPos}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-P4ssword!}
      POWERSYNC_DB_PASSWORD: ${POWERSYNC_DB_PASSWORD:?set POWERSYNC_DB_PASSWORD in .env}
    # PowerSync replicates via logical replication.
    command: ["postgres", "-c", "wal_level=logical"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Creates the powersync_role + `powersync` publication on first start of an empty DB.
      - ./powersync/postgres-init.sh:/docker-entrypoint-initdb.d/10-powersync.sh:ro
      # - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sastaPos}"]
      interval: 5s
      timeout: 5s
      retries: 15

  # Extend the imported powersync service: wait for the local Postgres above.
  powersync:
    depends_on:
      postgres:
        condition: service_healthy

