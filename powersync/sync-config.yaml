# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json
#
# Defines WHAT data gets synced to clients, and how it's partitioned into buckets.
# Docs: https://docs.powersync.com/sync/streams/overview
#
# NOTE: changes to this file are not hot-reloaded - restart the powersync
# container after editing it.

config:
  edition: 3

streams:
  # Each device/user authenticates with a JWT carrying a `store_id` claim (set by the
  # backend at login). Since auth parameters come from the signed JWT, clients cannot
  # tamper with this to see another store's data.
  store_data:
    auto_subscribe: true
    queries:
      # Every table referenced here must be included in the Postgres `powersync`
      # publication (see README.md "Postgres setup" section).
      - SELECT * FROM stores WHERE id = auth.parameter('store_id')
      # Staff identity is needed by sales and void records. Never sync password_hash.
      - |
        SELECT id, name, email, role, status, last_login_at, store_id, date_created, last_updated
        FROM users WHERE store_id = auth.parameter('store_id')
      - SELECT * FROM products WHERE store_id = auth.parameter('store_id')
      - SELECT * FROM stock_movements WHERE store_id = auth.parameter('store_id')
      # product_tax_categories has no store_id column, so scope it via its product.
      - |
        SELECT product_tax_categories.* FROM product_tax_categories
        WHERE product_id IN (SELECT id FROM products WHERE store_id = auth.parameter('store_id'))
      - SELECT * FROM units_of_measures
      - SELECT * FROM customers WHERE store_id = auth.parameter('store_id')
      - SELECT * FROM tax_categories WHERE store_id IS NULL OR store_id = auth.parameter('store_id')
      - SELECT * FROM sales WHERE store_id = auth.parameter('store_id')
      # sale_items has no store_id column directly, so scope it via its parent sale.
      - |
        SELECT sale_items.* FROM sale_items
        WHERE sale_id IN (SELECT id FROM sales WHERE store_id = auth.parameter('store_id'))
      # payments and ledger_entries have no store_id either; scope them via their sale / customer.
      - |
        SELECT payments.* FROM payments
        WHERE sale_id IN (SELECT id FROM sales WHERE store_id = auth.parameter('store_id'))
      - |
        SELECT ledger_entries.* FROM ledger_entries
        WHERE customer_id IN (SELECT id FROM customers WHERE store_id = auth.parameter('store_id'))
      # Invoice numbering settings of the signed-in store (stores.store_settings_id).
      - |
        SELECT * FROM business_settings
        WHERE id IN (SELECT store_settings_id FROM stores WHERE id = auth.parameter('store_id'))

  # Example of a per-user stream (not auto-subscribed): uncomment and adapt
  # once you have JWTs including a user id claim.
  # user_data:
  #   auto_subscribe: false
  #   queries:
  #     - SELECT * FROM orders WHERE user_id = subscription.parameters() ->> 'user_id'
